services:
  postgres:
    image: postgres:18-alpine
    container_name: carwash-postgres
    environment:
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash
      POSTGRES_DB: postgres
      LEDGER_OWNER_PASSWORD: ledger_owner
      LEDGER_APP_PASSWORD: ledger_app
      LEDGER_AUDIT_PASSWORD: ledger_audit
      PSP_DB_PASSWORD: psp
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:5449:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "carwash", "-d", "ledger"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: carwash-kafka
    environment:
      CLUSTER_ID: 7Rw-RRluI0GVb4OrwYRvkA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9194,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms320m -Xmx320m
    ports:
      - "127.0.0.1:9194:9092"
    mem_limit: 640m

volumes:
  pgdata:
