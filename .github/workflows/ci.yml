name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --wait postgres kafka
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carwash/db generate
      - run: pnpm format:check
      - run: for patch in tools/chaos/mutants/*.patch; do git apply --check "$patch"; done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm --filter @carwash/web build
      - if: failure()
        run: docker compose logs --no-color --tail 200

  chaos:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - run: chmod a+w tools/chaos/results && CHAOS_CPUS=$(nproc) sh tools/chaos/run.sh --runs 3 --duration 30 --fail-on-violation
